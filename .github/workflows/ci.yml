name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Installs the dependencies (pi-memo-question, from git) plus the host packages that pi normally provides at runtime.
      - run: npm install --no-save --no-package-lock --no-audit --no-fund --ignore-scripts @earendil-works/pi-coding-agent @earendil-works/pi-ai @earendil-works/pi-tui typebox
      - run: npm test
