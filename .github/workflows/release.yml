name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Tag $GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Tag must match package.json version
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::Tag $GITHUB_REF_NAME != package.json version v$v"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock --no-audit --no-fund --ignore-scripts @earendil-works/pi-coding-agent @earendil-works/pi-ai @earendil-works/pi-tui typebox
      - run: npm test

      # No build artifacts: pi installs straight from the git source.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
